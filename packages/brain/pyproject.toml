[project]
name = "faberon"
version = "0.3.0"
description = "Faberon: Autonomous ML Research Harness"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "dbos>=2.31.0,<3",
    "fastapi>=0.141.1,<1",
    "httpx2>=2.12.0,<3",
    "psycopg[binary]>=3.3.5,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-ai-slim[openrouter]>=2.45.0,<3",
    "typer>=0.20.0,<0.28.0",
    "uvicorn>=0.52.4,<1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/sevren-ai/faberon"
Repository = "https://github.com/sevren-ai/faberon"
Issues = "https://github.com/sevren-ai/faberon/issues"

[project.scripts]
faberon = "faberon.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.5,<0.17",
    "ty>=0.0.78,<0.0.79",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "postgres: requires a real Postgres; set FABERON_DATABASE_URL",
    "slurm: requires a real Slurm cluster; opt in with FABERON_SLURM_INTEGRATION=1",
    "llm: requires a real model; set FABERON_MODEL and the provider key",
]
filterwarnings = [
    # Starlette TestClient still imports anyio.abc.BlockingPortal; fixed upstream later.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
