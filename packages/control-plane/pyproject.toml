[project]
name = "faberon"
version = "0.1.0"
description = "Faberon: Autonomous ML Research Harness"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "ty>=0.0.78",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
